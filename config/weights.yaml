# Scoring methodology. Change here, not in code. Documented in docs/design.md.
version: 2

weights:               # must sum to 1.0
  utilization: 0.25    # seat load factor on passenger service (demand pressure proxy)
  congestion: 0.25     # delays and taxi-out (capacity strain)
  scale: 0.15          # annual passengers: keeps the ranking about money, not only pressure
  growth: 0.15         # passenger growth, window vs previous 12 months
  long_haul: 0.10      # wide-body and international facility signal; secondary, distorted by cargo
  demand_context: 0.10 # metro population growth (Census)

congestion:            # must sum to 1.0. Cancellations are shown but not scored (mostly weather).
  dep_delay_rate: 0.40       # departures delayed >= 15 min, at the origin airport
  taxi_out: 0.30             # mean taxi-out minutes, at the origin airport
  nas_delay_per_arrival: 0.30  # NAS-caused delay minutes per arriving flight (BTS records causes for arrivals)

min_ontime_flights: 1000     # On-Time departures (scheduled, in the window) needed to score congestion.
                             # On-Time covers only large reporting carriers; fewer flights -> congestion
                             # missing for that airport (renormalized, medium confidence). See the decision log.

long_haul_miles: 2500
long_haul_min_share: 0.02     # share below this counts as 0 for the long_haul component (a few charters are not a signal)
long_haul_sensitivity_miles: [1500, 2500, 3000]

min_passengers_per_year: 100000   # passenger-service passengers in the window, to be in the peer set
                                  # (a departure floor let 9-seat commuter airports in and kept ORH and PSM out)

unmet_demand:                   # explain_demand_gap: a PROXY, unmet demand is not observable here
  target_load_factor: 0.80      # passengers carried above this load (per route and month) = spill proxy
  target_sensitivity: [0.75, 0.80, 0.85]  # the spill proxy is also given at these targets (range)
  peak_months: 3                # highest load-factor months listed
  top_routes: 5                 # routes listed (by passengers, and by share of the spill proxy)

sensitivity:                    # rank stability under weight perturbation (rank_airports)
  runs: 20
  weight_jitter: 0.25           # +/- relative change per weight, then renormalized
  seed: 42                      # same seed, same result
  top_n: 3                      # report the share of runs each airport spends in this top N
  stable_share: 0.9             # the #1 airport is called unstable if first in fewer runs than this

comparison:                     # compare_airports
  confidence_level: 0.95        # margin of error on On-Time figures; a difference inside the combined
                                # margin is reported as "no meaningful difference"
  size_ratio_note: 3.0          # headline note when one airport has more than this many times the other's
                                # departures (rates still compare; totals and margins differ in kind)

census:                         # demand_context: metro population growth (Census Data API, ingest only)
  dataset: acs/acs5             # ACS 5-year estimates: the only Census series covering every metro and micro area
  variable: B01003_001E         # total population
  vintage: 2024                 # ACS 5-year 2020-2024 (latest published as of 2026-10)
  base_vintage: 2019            # ACS 5-year 2015-2019: the previous non-overlapping period, base for growth
  geocoder_benchmark: Public_AR_Current   # Census Geocoder benchmark (address ranges)
  geocoder_vintage: ACS2024_Current   # CBSA delineation the Census Geocoder uses (airport -> CBSA); matches `vintage`

commentary:                     # what the model may write under a card (src/figure_check.py)
  # For these tools the card and headline give the result (an ordering or a verdict, which a figure
  # check cannot verify): the commentary keeps only sentences with no digit, no airport code and no
  # airport name (caveats, next steps). Other tools keep the figure check.
  restricted_tools: [rank_airports, compare_airports]

scope:                          # fixed wording the tools attach to answers outside the data's scope
  # Airports outside the US (no US state): T-100 holds only segments that touch the US, so their
  # figures are partial. Added as an assumption and a required fact to every envelope about one.
  non_us_airport: "US-linked traffic only (T-100), not total airport traffic."

# Longest ranking rank_airports returns, whatever top_n asks for (scenario or not). Keeps tool
# results within a local model's context window.
max_ranked: 25

regions:
  new_england: [MA, CT, RI, NH, VT, ME]

# Names that mean several airports. resolve_airport returns them as ambiguous, with the default
# definition the agent states when it does not ask. Keys are matched case-insensitively.
metro_aliases:
  LA: {default: LAX, candidates: [LAX, BUR, LGB, ONT, SNA]}
